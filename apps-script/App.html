<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0F2340; --azul: #1F4FD1; --azul-claro: #E7EEFD; --azul-osc: #1A3E9E; --naranja: #B8430E; --naranja-claro: #FDECE2;
    --fondo: #F2F4F7; --tinta: #0E1726; --gris: #475263; --gris2: #5E6878; --linea: #E2E6EC; --borde: #D5DAE2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--tinta); font-family: 'Barlow', system-ui, sans-serif; font-size: 15px; }
  .num { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-variant-numeric: tabular-nums; }
  header { background: var(--navy); color: #fff; padding: 18px 18px 22px; display: flex; flex-direction: column; gap: 16px; }
  .marca { display: flex; align-items: center; gap: 12px; }
  .logo { width: 40px; height: 40px; border-radius: 12px; background: var(--azul); display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; flex: none; }
  .titulo-h { font-weight: 600; font-size: 17px; }
  .sub { color: #B9C6DC; font-size: 13px; }
  .etq { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #B9C6DC; }
  .grande { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .grande .num { font-size: 56px; line-height: 1; }
  .grande span:last-child { color: #B9C6DC; font-size: 17px; }
  .barra { height: 12px; border-radius: 6px; background: #22385A; overflow: hidden; }
  .barra div { height: 100%; border-radius: 6px; background: #6E9BFF; }
  .pie { display: flex; justify-content: space-between; font-weight: 600; gap: 10px; }
  .falta { color: #FFB48A; } .ok { color: #9EE0B5; }
  .volver { width: 44px; height: 44px; border-radius: 12px; border: 1px solid #2E4566; background: transparent; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
  main { padding: 16px 16px 100px; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .seccion { display: none; flex-direction: column; gap: 16px; }
  .seccion.activa { display: flex; }
  .card { background: #fff; border: 1px solid var(--linea); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .card h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .titulo-sec { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--gris2); }
  .kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .kpi { gap: 6px; }
  .kpi .etq2 { color: var(--gris); font-size: 14px; }
  .kpi .num { font-size: 30px; line-height: 1; }
  .det { color: var(--gris2); font-size: 13px; }
  .fila { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #EEF1F5; }
  .fila:last-child { border-bottom: none; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; flex: none; background: var(--naranja-claro); color: var(--naranja); }
  .cuerpo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .nombre { font-weight: 600; font-size: 16px; }
  .rojo { color: var(--naranja); } .azul { color: var(--azul); }
  .vacio { color: var(--gris2); padding: 4px 0; }
  .alias { display: flex; align-items: center; gap: 10px; background: var(--fondo); border-radius: 12px; padding: 10px 10px 10px 14px; }
  .alias b { flex: 1; font-size: 17px; }
  .leyenda { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; color: var(--gris); }
  .leyenda span { display: inline-flex; align-items: center; gap: 6px; }
  .leyenda i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
  .grilla { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { border-collapse: separate; border-spacing: 4px; }
  th, td { padding: 0; text-align: center; font-size: 13px; white-space: nowrap; }
  th { color: var(--gris); font-weight: 600; padding: 0 2px 4px; }
  th.actual { color: var(--azul); font-weight: 700; }
  th:first-child, td:first-child, tbody th { position: sticky; left: 0; background: #fff; text-align: left; padding-right: 8px; font-weight: 600; font-size: 15px; color: var(--tinta); z-index: 1; }
  .c { width: 34px; height: 32px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
  .c.pagado { background: var(--azul); color: #fff; }
  .c.debe { background: var(--naranja-claro); border: 1.5px solid #D9561A; color: var(--naranja); }
  .c.sinvencer { background: #EEF1F5; color: var(--gris); }
  .c.nojuega { background: transparent; }
  .c.nojuega::after { content: ''; width: 18px; height: 2px; background: #9AA3B0; }
  .c.medio.sinvencer { background: var(--azul-claro); border: 1.5px solid var(--azul); color: var(--azul-osc); }
  .tira { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
  .tira div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--gris); }
  .tira .c { width: 100%; }
  .tabla { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px 14px; font-size: 14px; }
  .tabla .h { color: var(--gris); font-weight: 600; }
  .der { text-align: right; font-variant-numeric: tabular-nums; }
  .estado { border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 6px; }
  .estado.debe { background: var(--naranja-claro); color: #6E2707; }
  .estado.ok { background: var(--azul-claro); color: var(--azul-osc); }
  .estado .num { font-size: 44px; line-height: 1.05; }
  .apilada { display: flex; gap: 2px; height: 14px; border-radius: 7px; overflow: hidden; background: #EEF1F5; }
  .punto { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  label, .lbl { display: block; font-size: 13px; font-weight: 600; color: var(--gris); margin-bottom: 6px; }
  .campo { display: flex; flex-direction: column; }
  input[type=text], input[type=number], input[type=date], input[type=password], input[type=tel], select {
    width: 100%; min-height: 48px; border: 1px solid var(--borde); border-radius: 12px; padding: 0 12px; font: inherit; font-size: 16px; background: #fff; color: var(--tinta); }
  .dos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .opciones { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .opciones.de2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .opcion { min-height: 44px; border: 1px solid var(--borde); border-radius: 12px; background: #fff; color: var(--tinta); font: inherit; font-weight: 500; cursor: pointer; padding: 4px 6px; }
  .opcion[aria-pressed=true] { border: 1.5px solid var(--azul); background: var(--azul-claro); color: var(--azul-osc); font-weight: 600; }
  .check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; color: var(--tinta); font-weight: 500; margin: 0; }
  .check input { width: 20px; height: 20px; }
  button.prim { min-height: 52px; border: none; border-radius: 12px; background: var(--azul); color: #fff; font: inherit; font-weight: 600; font-size: 17px; cursor: pointer; }
  button.sec { min-height: 44px; padding: 0 14px; border: 1px solid var(--borde); border-radius: 12px; background: #fff; color: var(--azul); font: inherit; font-weight: 600; cursor: pointer; flex: none; }
  button.peligro { min-height: 48px; border: 1px solid #D9561A; border-radius: 12px; background: #fff; color: var(--naranja); font: inherit; font-weight: 600; cursor: pointer; }
  button.link { border: none; background: none; padding: 4px; min-height: 44px; font: inherit; color: var(--azul); text-decoration: underline; cursor: pointer; }
  button.link.gris { color: var(--gris); font-size: 14px; }
  button:disabled { opacity: .55; cursor: default; }
  .aviso-box { border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  .aviso-box.info { background: var(--azul-claro); color: var(--azul-osc); }
  .aviso-box.alerta { background: var(--naranja-claro); color: #6E2707; }
  .error { color: var(--naranja); font-size: 14px; font-weight: 600; margin: 0; }
  .ayuda { color: var(--gris2); font-size: 13px; margin: 0; }
  .tarjeta { background: #fff; border: 1px solid var(--linea); border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--tinta); width: 100%; font: inherit; text-align: left; cursor: pointer; min-height: 72px; }
  .contador { width: 44px; height: 44px; border-radius: 12px; background: var(--naranja-claro); color: var(--naranja); display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; flex: none; }
  .contador.cero { background: #EEF1F5; color: var(--gris); }
  .icono { width: 40px; height: 40px; border-radius: 12px; background: var(--azul-claro); color: var(--azul); display: flex; align-items: center; justify-content: center; flex: none; }
  .accion { flex-direction: column; align-items: flex-start; min-height: 112px; gap: 10px; }
  .lista { background: #fff; border: 1px solid var(--linea); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; }
  .lista button { border: none; border-bottom: 1px solid #EEF1F5; background: #fff; display: flex; align-items: center; gap: 12px; padding: 14px 16px; min-height: 56px; font: inherit; text-align: left; cursor: pointer; color: var(--tinta); }
  .lista button:last-child { border-bottom: none; }
  .pendiente { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-bottom: 1px solid #EEF1F5; }
  .pendiente:last-child { border-bottom: none; }
  .arriba { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .linea-sel { display: flex; gap: 8px; }
  .linea-sel select, .linea-sel input { min-height: 44px; }
  .burbuja { background: #E9F3E6; border-radius: 14px 14px 14px 4px; padding: 14px; font-size: 15px; line-height: 1.45; color: #13261A; white-space: pre-line; word-break: break-word; }
  .subir { border: 1.5px dashed #9AA3B0; border-radius: 14px; min-height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--gris); cursor: pointer; padding: 16px; text-align: center; margin: 0; }
  .subir b { color: var(--azul); }
  .solo-lector { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .actualizado { text-align: center; color: var(--gris2); font-size: 12px; margin: 0; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--linea); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 4px calc(10px + env(safe-area-inset-bottom)); z-index: 5; }
  nav button { min-height: 56px; border: none; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: inherit; font-size: 12px; color: var(--gris2); cursor: pointer; }
  nav button.activa { color: var(--azul); font-weight: 600; }
  nav svg { width: 22px; height: 22px; }
  body.admin nav { display: none; }
  body.admin main { padding-bottom: 32px; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom)); max-width: 608px; margin: 0 auto; background: var(--navy); color: #fff; border-radius: 12px; padding: 12px 14px; font-size: 14px; display: none; z-index: 10; }
  body.admin .toast { bottom: calc(20px + env(safe-area-inset-bottom)); }
  .toast.error { background: var(--naranja); }
  .tachado { text-decoration: line-through; color: var(--gris2); }
  .etiqueta { font-size: 12px; font-weight: 600; border-radius: 6px; padding: 2px 6px; background: #EEF1F5; color: var(--gris); }
  .etiqueta.anulado { background: var(--naranja-claro); color: var(--naranja); }
</style>
</head>
<body>
<header id="cabecera"></header>

<main>
  <section class="seccion activa" id="s-inicio"></section>
  <section class="seccion" id="s-planilla"></section>
  <section class="seccion" id="s-cuota"></section>
  <section class="seccion" id="s-caja"></section>
  <section class="seccion" id="s-admin"></section>
  <p class="actualizado" id="pie"></p>
</main>

<nav aria-label="Secciones">
  <button data-s="inicio" class="activa"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
  <button data-s="planilla"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>Planilla</button>
  <button data-s="cuota"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Mi cuota</button>
  <button data-s="caja"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg>Caja</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
let DATA = <?!= datos ?>;

const $ = id => document.getElementById(id);
const pesos = n => (n < 0 ? '−' : '') + '$' + Math.round(Math.abs(n)).toLocaleString('es-AR');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const iniciales = a => a.split(/\s+/).map(p => p[0]).join('').slice(0, 2).toUpperCase();
const plural = (n, s, p) => n + ' ' + (n === 1 ? s : p);
const mesDe = texto => String(texto || '').split(' ')[0];
const ICONO_VOLVER = '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>';
const FLECHA = '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E6878" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
let seccion = 'inicio';

function mesIdx() { return DATA.mesIdx >= 0 ? DATA.mesIdx : 0; }

function celda(s) {
  const clase = 'c ' + s.e + (s.medio ? ' medio' : '');
  const txt = s.e === 'pagado' ? (s.medio ? '½' : '✓') : s.e === 'debe' ? (s.medio ? '½' : '!') : (s.medio ? '½' : '');
  const titulo = { pagado: 'Pagado', debe: 'Debe', sinvencer: 'Sin vencer', nojuega: 'No juega' }[s.e] + (s.medio ? ' (media cuota)' : '');
  return '<span class="' + clase + '" title="' + titulo + '" aria-label="' + titulo + '">' + txt + '</span>';
}

function aliasCard() {
  if (!DATA.alias) return '';
  return '<div class="card"><h2>Cómo pagar</h2><div class="alias"><b>' + esc(DATA.alias) +
    '</b><button class="sec" data-copiar="' + esc(DATA.alias) + '">Copiar alias</button></div>' +
    '<p class="ayuda">Transferí desde Mercado Pago: tu pago se registra solo en unos 30 minutos. En efectivo, dáselo al administrador.</p></div>';
}

// ---------------------------------------------------------------- público
function cabeceraInicio() {
  const c = DATA.cancha;
  const pct = c.costo ? Math.min(100, Math.round(c.recaudado / c.costo * 100)) : 0;
  return '<div class="marca"><div class="logo">H</div><div><div class="titulo-h">Caja del equipo</div><div class="sub">Hockey · ' + esc(DATA.mes) + '</div></div></div>' +
    '<div style="display:flex;flex-direction:column;gap:10px"><span class="etq">Cancha de ' + esc(mesDe(DATA.mes)) + '</span>' +
    '<div class="grande"><span class="num">' + pesos(c.recaudado) + '</span><span>de ' + pesos(c.costo) + '</span></div>' +
    '<div class="barra"><div style="width:' + pct + '%"></div></div>' +
    '<div class="pie"><span>' + c.pagaron + ' de ' + c.total + ' pagaron</span>' +
    (c.faltan > 0 ? '<span class="falta">Faltan ' + pesos(c.faltan) + '</span>' : '<span class="ok">Cubierta</span>') + '</div>' +
    '<span class="sub" style="font-size:14px">' + (c.pagada ? 'Cancha pagada al club' + (c.fechaPago ? ' el ' + esc(c.fechaPago) : '') + '.' :
      'Vence el ' + esc(c.vence) + '. Se necesitan ' + c.necesarios + ' cuotas para cubrirla.') + '</span></div>';
}

function cabeceraSimple(titulo, sub) {
  return '<div class="marca"><div class="logo">H</div><div><div class="titulo-h">' + esc(titulo) + '</div>' +
    (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') + '</div></div>';
}

function inicio() {
  const deben = DATA.integrantes.filter(m => m.cuotasDebe > 0);
  $('s-inicio').innerHTML =
    '<div class="kpis"><div class="card kpi"><span class="etq2">Saldo en caja</span><span class="num">' + pesos(DATA.caja.saldo) +
    '</span><span class="det">Mercado Pago y efectivo</span></div><div class="card kpi"><span class="etq2">Fondo equipamiento</span><span class="num">' +
    pesos(DATA.caja.fondo) + '</span><span class="det">Lo que sobra después de la cancha</span></div></div>' +
    '<div class="card"><div class="arriba"><h2>Falta pagar ' + esc(mesDe(DATA.mes)) + '</h2><button class="link" data-ir="planilla">Ver planilla</button></div><div>' +
    (deben.length ? deben.map(m => '<div class="fila"><span class="avatar">' + esc(iniciales(m.apodo)) + '</span><span class="cuerpo"><span class="nombre">' +
      esc(m.apodo) + '</span></span><span class="rojo" style="font-weight:600">Debe ' + plural(m.cuotasDebe, 'cuota', 'cuotas') + '</span></div>').join('')
      : '<div class="vacio">Todos al día.</div>') + '</div></div>' + aliasCard();
}

function planilla() {
  const idx = mesIdx();
  let t = '<thead><tr><th scope="col">Integrante</th>' + DATA.meses.map((m, i) =>
    '<th scope="col" class="' + (i === idx ? 'actual' : '') + '">' + esc(m.corto) + '</th>').join('') + '</tr></thead><tbody>';
  t += DATA.integrantes.map(m => '<tr><th scope="row">' + esc(m.apodo) + (m.baja ? ' <span class="det">(baja)</span>' : '') + '</th>' +
    m.estados.map(s => '<td>' + celda(s) + '</td>').join('') + '</tr>').join('');
  $('s-planilla').innerHTML =
    '<div class="card"><h2>Planilla de cuotas</h2><div class="leyenda">' +
    '<span><i style="background:var(--azul)"></i>Pagado</span><span><i style="background:var(--naranja-claro);border:1.5px solid #D9561A"></i>Debe</span>' +
    '<span><i style="background:var(--azul-claro);border:1.5px solid var(--azul)"></i>½ Media cuota</span><span><i style="background:#EEF1F5"></i>Sin vencer</span>' +
    '<span><i style="height:2px;background:#9AA3B0"></i>No juega</span></div>' +
    '<div class="grilla"><table>' + t + '</tbody></table></div></div>' +
    '<div class="card"><h2>Valor de cada mes</h2><div class="tabla"><span class="h">Desde</span><span class="h der">Cuota</span><span class="h der">Cancha</span>' +
    DATA.valores.map(v => '<span>' + esc(v.desde) + '</span><span class="der">' + pesos(v.cuota) + '</span><span class="der">' + pesos(v.cancha) + '</span>').join('') +
    '</div><p class="ayuda">Si la cuota sube, los meses pagados por adelantado se recalculan y puede quedar una diferencia a pagar.</p></div>';
}

function miCuota(apodo) {
  const m = DATA.integrantes.find(x => x.apodo === apodo);
  const cont = $('miCuota');
  if (!m) { cont.innerHTML = ''; return; }
  const desde = Math.max(0, mesIdx() - 1);
  const debeMeses = m.estados.map((s, i) => (s.e === 'debe' ? DATA.meses[i].largo : null)).filter(Boolean);
  const tira = DATA.meses.slice(desde, desde + 6).map((mes, i) => '<div>' + celda(m.estados[desde + i]) + esc(mes.corto) + '</div>').join('');
  cont.innerHTML = (m.cuotasDebe > 0
    ? '<div class="estado debe"><span class="etq" style="color:inherit">Para ponerte al día</span><span class="num">' + plural(m.cuotasDebe, 'cuota', 'cuotas') +
      '</span><span>' + esc(debeMeses.join(', ')) + '</span></div>'
    : '<div class="estado ok"><span class="etq" style="color:inherit">Estás al día</span><span class="num">✓</span><span>' +
      (m.hasta ? 'Pagado hasta ' + esc(m.hasta) : 'Sin cuotas vencidas') + '</span></div>') +
    '<div class="card"><h2>Mis meses</h2><div class="tira">' + tira + '</div></div>' + aliasCard();
  activarCopiar(cont);
}

function cuota() {
  $('s-cuota').innerHTML = '<div class="card"><label for="quien">¿Quién sos?</label><select id="quien"><option value="">Elegí tu nombre</option>' +

  const sel = $('quien');

  miCuota(sel.value);

}

function caja() {
  const k = DATA.caja;
  const total = Math.max(k.adelantos, 0) + Math.max(k.fondo, 0);
  const pa = total ? Math.round(Math.max(k.adelantos, 0) / total * 100) : 0;
  $('s-caja').innerHTML =
    '<div class="card"><h2>De qué está hecho el saldo</h2><div class="apilada"><div style="width:' + pa + '%;background:var(--azul)"></div><div style="width:' + (total ? 100 - pa : 0) + '%;background:#A9C0F5"></div></div>' +
    '<div class="fila" style="border:none;padding:4px 0"><span class="punto" style="background:var(--azul)"></span><span class="cuerpo" style="color:var(--gris)">Cuotas pagadas por adelantado</span><b class="der">' + pesos(k.adelantos) + '</b></div>' +
    '<div class="fila" style="border:none;padding:4px 0"><span class="punto" style="background:#A9C0F5"></span><span class="cuerpo" style="color:var(--gris)">Disponible para equipamiento</span><b class="der">' + pesos(k.fondo) + '</b></div>' +
    (DATA.cancha.pagada ? '' : '<p class="ayuda">Se reservan ' + pesos(DATA.cancha.costo) + ' para la cancha del mes.</p>') + '</div>' +
    '<div class="card"><h2>Cobrado por mes</h2>' + (DATA.porMes.length ? DATA.porMes.map(p => '<div style="display:flex;flex-direction:column;gap:4px">' +
      '<div class="arriba"><b>' + esc(p.mes.charAt(0).toUpperCase() + p.mes.slice(1)) + '</b><b class="der">' + pesos(p.cuotas + p.otros) + '</b></div>' +
      '<span class="det">Cuotas ' + pesos(p.cuotas) + (p.otros ? ' · otros ' + pesos(p.otros) : '') + '</span></div>').join('') : '<div class="vacio">Sin cobros.</div>') + '</div>' +
    '<div class="card"><h2>Gastos</h2><div>' + (DATA.gastos.length ? DATA.gastos.map(g => '<div class="fila"><span class="cuerpo"><span class="nombre">' + esc(g.concepto) +

function mostrar(nombre) {
  seccion = nombre;
  document.body.classList.toggle('admin', nombre === 'admin');
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('activa', x.dataset.s === nombre));
  document.querySelectorAll('.seccion').forEach(s => s.classList.toggle('activa', s.id === 's-' + nombre));
  if (nombre !== 'admin') pintarCabecera();
  window.scrollTo(0, 0);
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => mostrar(b.dataset.s));

function activarCopiar(raiz) {
  raiz.querySelectorAll('[data-copiar]').forEach(b => b.onclick = () => copiar(b.dataset.copiar, b));
}
function copiar(texto, boton) {
  const listo = () => { const t = boton.textContent; boton.textContent = 'Copiado'; setTimeout(() => (boton.textContent = t), 1500); };
  const plan = () => {
    const a = document.createElement('textarea'); a.value = texto; document.body.appendChild(a); a.select();
    try { document.execCommand('copy'); listo(); } catch (e) {} a.remove();
  };
  if (navigator.clipboard) navigator.clipboard.writeText(texto).then(listo, plan); else plan();
}

let toastTimer = null;
function toast(texto, esError) {
  const a = $('toast');
  a.textContent = texto;
  a.className = 'toast' + (esError ? ' error' : '');
  a.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { a.style.display = 'none'; }, esError ? 7000 : 4500);
}

// ---------------------------------------------------------------- administrador
// El PIN se verifica en el servidor en cada acción. Con "recordar", queda solo en este celular.
const CLAVE_PIN = 'cajaHockeyPin';
let pin = '';
let ADMIN = null;
let vista = 'inicio';
let estadoForm = {};
try { pin = localStorage.getItem(CLAVE_PIN) || ''; } catch (e) {}

function servidor(funcion, args, alTerminar, boton, alFallar) {
  if (!window.google || !google.script) { toast('El panel funciona solo dentro de la app publicada.', true); return; }
  if (boton) boton.disabled = true;
  google.script.run
    .withSuccessHandler(r => { if (boton) boton.disabled = false; alTerminar(r); })
    .withFailureHandler(e => {
      if (boton) boton.disabled = false;
      const texto = (e && e.message) || String(e);
      if (/PIN incorrecto|Todavía no hay PIN/.test(texto)) { olvidarPin(); login(texto); return; }
      if (!ADMIN) { login(texto); return; }
      if (alFallar) alFallar(texto);
      toast(texto, true);
    })[funcion].apply(null, args);
}

function olvidarPin() {
  pin = ''; ADMIN = null;
  try { localStorage.removeItem(CLAVE_PIN); } catch (e) {}
}

function abrirAdmin() {
  mostrar('admin');
  if (ADMIN) ir('inicio');
  else if (pin) {
    cabeceraAdmin('Panel del administrador', 'Entrando…', null);
    $('s-admin').innerHTML = '<div class="card"><div class="vacio">Entrando…</div></div>';
    servidor('adminEntrar', [pin], r => { ADMIN = r; ir('inicio'); });
  } else login();
}

function cabeceraAdmin(titulo, sub, volverA) {

    (volverA === null && ADMIN ? '<button class="volver" id="salir" style="width:auto;padding:0 12px;font:inherit;font-size:14px">Salir</button>' : '') + '</div>';
  $('volver').onclick = () => (typeof volverA === 'function' ? volverA() : volverA ? ir(volverA) : mostrar('inicio'));
  if ($('salir')) $('salir').onclick = () => {
    if (/^t:/.test(pin) && window.google && google.script) google.script.run.adminSalir(pin);
    olvidarPin(); mostrar('inicio'); toast('Saliste del panel.');

function login(error) {
  mostrar('admin');
  cabeceraAdmin('Panel del administrador', '', null);
  $('s-admin').innerHTML = '<div class="card"><h2>Entrar al panel</h2>' +
    '<p class="ayuda">Para cargar efectivo y gastos, asignar transferencias, dar altas y bajas y cambiar valores.</p>' +
    '<div class="campo"><label for="pin">PIN</label><input type="password" id="pin" inputmode="numeric" autocomplete="current-password" maxlength="12"></div>' +
    '<label class="check"><input type="checkbox" id="recordar"> Recordar en este celular</label>' +
    (error ? '<p class="error">' + esc(error) + '</p>' : '') + '<button class="prim" id="entrar">Entrar</button></div>';
  const entrar = () => {
    const p = $('pin').value.trim();
    if (!p) return;
    const recordar = !!($('recordar') && $('recordar').checked);
    servidor('adminEntrar', [p, recordar], r => {
      ADMIN = r;
      pin = r.token || p;
      if (r.token) { try { localStorage.setItem(CLAVE_PIN, r.token); } catch (e) {} }
      ir('inicio');
    }, $('entrar'));
  };
  $('entrar').onclick = entrar;
  $('pin').onkeydown = e => { if (e.key === 'Enter') entrar(); };
}

function listo(volverA) {
  return r => {
    ADMIN = r.admin; DATA = r.datos; pintar();
    toast(r.mensaje);
    ir(volverA || vista);
  };
}

function ir(v, extra) {
  vista = v;
  const vistas = { inicio: vInicio, revisar: vRevisar, efectivo: vEfectivo, gasto: vGasto, integrantes: vIntegrantes,
    integrante: vIntegrante, editarIntegrante: vEditarIntegrante, valores: vValores, valor: vValor, whatsapp: vWhatsapp,
    pagos: vPagos, pago: vPago, gastos: vGastos, gastoEditar: vGastoEditar, config: vConfig };
  (vistas[v] || vInicio)(extra);
  window.scrollTo(0, 0);
}

function opciones(lista, elegido, vacio) {
  return (vacio ? '<option value="">' + esc(vacio) + '</option>' : '') +
    lista.map(o => {
      const v = typeof o === 'string' ? o : o.clave;
      const t = typeof o === 'string' ? o : o.texto;
      return '<option value="' + esc(v) + '"' + (v === elegido ? ' selected' : '') + '>' + esc(t) + '</option>';
    }).join('');
}

/** Botones que borran o anulan: el primer toque pide confirmar, el segundo hace la acción. */
function dobleToque(boton, textoConfirmar, accion) {
  const original = boton.textContent;
  let armado = false, t = null;
  boton.onclick = () => {
    if (!armado) {
      armado = true; boton.textContent = textoConfirmar;
      t = setTimeout(() => { armado = false; boton.textContent = original; }, 5000);
      return;
    }
    clearTimeout(t); armado = false; boton.textContent = original;
    accion();
  };
}

/** Achica la foto (máx. 1600 px, JPEG) antes de mandarla. */
function achicarImagen(archivo) {
  return new Promise((ok, mal) => {
    const lector = new FileReader();
    lector.onerror = mal;
    lector.onload = () => {
      const img = new Image();
      img.onerror = mal;
      img.onload = () => {
        const escala = Math.min(1, 1600 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * escala); c.height = Math.round(img.height * escala);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
      };
      img.src = lector.result;
    };
    lector.readAsDataURL(archivo);
  });
}

    '<button class="prim" id="cPin">Cambiar PIN</button><p class="ayuda">De 6 a 12 números. Los otros celulares recordados van a tener que volver a entrar. Si te olvidás el PIN, lo definís de nuevo desde el menú de la planilla.</p></div>' +
    '<p class="ayuda">La clave de Mercado Pago se cambia desde el menú de la planilla: así nadie la puede cambiar con solo saber el PIN.</p>';
  $('cGuardar').onclick = () => servidor('adminConfig', [pin, { saldoInicial: $('cSaldo').value, alias: $('cAlias').value, vence: $('cVence').value }], listo('config'), $('cGuardar'));
  $('cPin').onclick = () => {
    const actual = $('cActual').value.trim(), nuevo = $('cNuevo').value.trim();
    if (!actual) return toast('Escribí tu PIN actual.', true);
    if (!/^\d{6,12}$/.test(nuevo)) return toast('El PIN nuevo tiene que tener de 6 a 12 números.', true);
    if (nuevo !== $('cRepetir').value.trim()) return toast('Los dos PIN nuevos no coinciden.', true);
    servidor('adminCambiarPin', [pin, actual, nuevo, /^t:/.test(pin)], r => {
      pin = r.token || nuevo;
      try { if (r.token) localStorage.setItem(CLAVE_PIN, r.token); else localStorage.removeItem(CLAVE_PIN); } catch (e) {}
      toast(r.mensaje); ir('inicio');
    }, $('cPin'));
  };
}

function vValores() {
  const a = ADMIN;
  cabeceraAdmin('Cuota y cancha', '', 'inicio');
  estadoForm = { tipoValor: 'cuota' };
  const ult = a.valores.length ? a.valores[a.valores.length - 1] : { cuota: 0, cancha: 0 };
  $('s-admin').innerHTML =
    '<div class="kpis"><div class="card kpi"><span class="etq2">Cuota de ' + esc(mesDe(a.mes)) + '</span><span class="num">' + pesos(a.cuotaMes) + '</span></div>' +
    '<div class="card kpi"><span class="etq2">Cancha de ' + esc(mesDe(a.mes)) + '</span><span class="num">' + pesos(a.canchaMes) + '</span></div></div>' +
    '<div class="card"><h2>Nuevo valor</h2><div><span class="lbl">Qué cambia</span><div class="opciones de2">' + botonesOpcion('tipoValor', [['cuota', 'Cuota'], ['cancha', 'Cancha']], 'cuota') + '</div></div>' +
    '<div class="dos"><div class="campo"><label for="vMonto">Monto ($)</label><input type="number" id="vMonto" inputmode="numeric" min="1" step="1" value="' + esc(ult.cuota || '') + '"></div>' +
    '<div class="campo"><label for="vDesde">Vigente desde</label><select id="vDesde">' + opciones(a.mesesValor, a.mesesValor[1] ? a.mesesValor[1].clave : '') + '</select></div></div>' +
    '<button class="sec" id="vVer" style="min-height:48px">Ver qué cambia</button><div id="vImpacto"></div>' +
    '<button class="prim" id="vGuardar" disabled>Guardar nuevo valor</button><p class="ayuda">Primero tocá "Ver qué cambia". Los meses anteriores a "vigente desde" no cambian.</p></div>' +
    '<h2 class="titulo-sec">Valores cargados (tocá uno para corregirlo o borrarlo)</h2><div class="lista">' +
    a.filasValores.map((v, i) => '<button data-fila-valor="' + i + '"><span class="cuerpo"><span class="nombre">Desde ' + esc(v.texto) + '</span><span class="det">Cuota ' +
      (v.cuota ? pesos(v.cuota) : 'sigue igual') + ' · cancha ' + (v.cancha ? pesos(v.cancha) : 'sigue igual') + '</span></span>' + FLECHA + '</button>').join('') + '</div>';
  const limpiar = () => { $('vImpacto').innerHTML = ''; $('vGuardar').disabled = true; };
  activarOpciones($('s-admin'), 'tipoValor', t => { $('vMonto').value = t === 'cuota' ? (ult.cuota || '') : (ult.cancha || ''); limpiar(); });
  $('vMonto').oninput = limpiar;
  $('vDesde').onchange = limpiar;
  const datos = () => ({ modo: 'nuevo', tipo: estadoForm.tipoValor, monto: $('vMonto').value, desde: $('vDesde').value });
  $('vVer').onclick = () => servidor('adminSimularValor', [pin, datos()], r => { mostrarImpacto($('vImpacto'), r, 'Qué cambia con este valor'); $('vGuardar').disabled = false; }, $('vVer'));
  $('vGuardar').onclick = () => servidor('adminNuevoValor', [pin, datos()], listo('valores'), $('vGuardar'));
  $('s-admin').querySelectorAll('[data-fila-valor]').forEach(b => b.onclick = () => ir('valor', a.filasValores[b.dataset.filaValor]));
}

function mostrarImpacto(cont, r, titulo) {
  const lineas = r.afectados.map(x => esc(x.apodo) + ' tiene que pagar ' + pesos(Math.abs(x.diferencia)) + (x.diferencia > 0 ? ' más.' : ' menos.'));
  if (!lineas.length) lineas.push('Nadie cambia lo que tiene que pagar.');
  lineas.push('Desde ' + esc(r.desde) + ' se necesitan ' + r.necesarios + ' cuotas para cubrir la cancha.');
  cont.innerHTML = '<div class="aviso-box alerta" style="display:flex;flex-direction:column;gap:6px"><b>' + esc(titulo) + '</b>' + lineas.map(l => '<span>' + l + '</span>').join('') + '</div>';
}

/** Corregir o borrar un valor cargado (decisión 35): siempre con vista previa antes de guardar. */
function vValor(v) {
  if (!v) return ir('valores');
  cabeceraAdmin('Valor desde ' + v.texto, 'Corregir o borrar', 'valores');
  $('s-admin').innerHTML = '<div class="card">' +
    '<div class="campo"><label for="vvDesde">Vigente desde</label><select id="vvDesde">' + opciones(ADMIN.mesesTemporada, v.clave) + '</select></div>' +
    '<div class="dos"><div class="campo"><label for="vvCuota">Cuota ($)</label><input type="number" id="vvCuota" inputmode="numeric" min="1" step="1" value="' + esc(v.cuota || '') + '"></div>' +
    '<div class="campo"><label for="vvCancha">Cancha ($)</label><input type="number" id="vvCancha" inputmode="numeric" min="1" step="1" value="' + esc(v.cancha || '') + '"></div></div>' +
    '<p class="ayuda">Vacío: sigue el valor de antes.</p>' +
    '<button class="sec" id="vvVer" style="min-height:48px">Ver qué cambia</button><div id="vvImpacto"></div>' +
    '<button class="prim" id="vvGuardar" disabled>Guardar corrección</button>' +
    '<button class="peligro" id="vvBorrar">Borrar este valor</button></div>';
  const datos = modo => ({ modo: modo, fila: v.fila, esperado: v.clave, desde: $('vvDesde').value, cuota: $('vvCuota').value, cancha: $('vvCancha').value });
  let borrarListo = false;
  const limpiar = () => {
    $('vvImpacto').innerHTML = ''; $('vvGuardar').disabled = true;
    borrarListo = false; $('vvBorrar').textContent = 'Borrar este valor';
  };
  $('vvDesde').onchange = limpiar; $('vvCuota').oninput = limpiar; $('vvCancha').oninput = limpiar;
  $('vvVer').onclick = () => servidor('adminSimularValor', [pin, datos('editar')], r => {
    limpiar(); mostrarImpacto($('vvImpacto'), r, 'Qué cambia con la corrección'); $('vvGuardar').disabled = false;
  }, $('vvVer'));
  $('vvGuardar').onclick = () => servidor('adminEditarValor', [pin, datos('editar')], listo('valores'), $('vvGuardar'));
  $('vvBorrar').onclick = () => {
    if (borrarListo) return servidor('adminBorrarValor', [pin, datos('borrar')], listo('valores'), $('vvBorrar'));
    servidor('adminSimularValor', [pin, datos('borrar')], r => {
      limpiar(); mostrarImpacto($('vvImpacto'), r, 'Qué cambia si lo borrás');
      borrarListo = true; $('vvBorrar').textContent = 'Confirmar: borrar este valor';
    }, $('vvBorrar'));
  };
}

function vWhatsapp() {
  const a = ADMIN;
  cabeceraAdmin('Mensaje para el grupo', '', 'inicio');
  $('s-admin').innerHTML = '<div class="card"><h2>Qué incluir</h2>' +
    '<label class="check"><input type="checkbox" id="wCancha" checked> Cancha del mes y cuánto falta</label>' +
    '<label class="check"><input type="checkbox" id="wNombres" checked> Nombres de quienes faltan pagar</label>' +
    '<label class="check"><input type="checkbox" id="wAlias" checked> Alias y link de la app</label></div>' +
    '<div class="card"><h2>Vista previa</h2><div class="burbuja" id="wTexto"></div><div class="dos"><button class="sec" id="wCopiar" style="min-height:52px">Copiar</button>' +
    '<a id="wAbrir" target="_blank" rel="noopener" style="min-height:52px;border-radius:12px;background:var(--azul);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;text-decoration:none">Abrir WhatsApp</a></div>' +
    '<p class="ayuda">"Abrir WhatsApp" abre la app con el texto listo: elegís el grupo y enviás vos.</p></div>';
  const armar = () => {
    const c = DATA.cancha;
    const deben = DATA.integrantes.filter(m => m.cuotasDebe > 0).map(m => m.apodo);
    const lista = deben.length > 1 ? deben.slice(0, -1).join(', ') + ' y ' + deben[deben.length - 1] : deben.join('');
    const l = ['Caja del hockey · ' + DATA.mes];
    if ($('wCancha').checked) {
      l.push('Cancha: ' + pesos(c.recaudado) + ' de ' + pesos(c.costo) + (c.faltan > 0 ? ' (faltan ' + pesos(c.faltan) + ').' : ' (cubierta).'));
      l.push('Pagaron ' + c.pagaron + ' de ' + c.total + '.');
    }
    if ($('wNombres').checked) l.push(deben.length ? 'Falta pagar: ' + lista + '.' : 'Todos al día.');
    if ($('wAlias').checked) {
      if (DATA.alias) l.push('Alias: ' + DATA.alias + ' (transferí desde Mercado Pago y se carga solo).');
      if (a.url) l.push('Ver todo: ' + a.url);
    }
    const texto = l.join('\n');
    $('wTexto').textContent = texto;
    $('wAbrir').href = 'https://wa.me/?text=' + encodeURIComponent(texto);
    return texto;
  };
  ['wCancha', 'wNombres', 'wAlias'].forEach(id => $(id).onchange = armar);
  armar();
  $('wCopiar').onclick = () => copiar(armar(), $('wCopiar'));
}

pintar();
</script>
